# jinOs@ai base image — Debian 13 (trixie) on a mainline LTS kernel, booted
# with systemd-boot as a UKI. See docs/components/base-image.md.
#
#   make image      -> mkosi --directory base --profile=dev build
#   make run        -> tools/run-qemu.sh build/jinos.raw
#
# Relative paths below resolve against this directory (mkosi chdirs here).

[Config]
MinimumVersion=25

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
Repositories=main

[Output]
Format=disk
ImageId=jinos
OutputDirectory=../build
CompressOutput=no

[Content]
Bootable=yes
Bootloader=systemd-boot
Hostname=jinos
Locale=C.UTF-8
Timezone=UTC
# Serial console first so `make boot-test` and `make run-serial` see the
# getty; tty0 keeps the graphical console alive for Phase 1.
KernelCommandLine=console=tty0 console=ttyS0,115200n8 rw
Packages=
        systemd
        systemd-boot
        systemd-sysv
        systemd-resolved
        systemd-timesyncd
        udev
        dbus-broker
        kmod
        linux-image-amd64
        e2fsprogs
        dosfstools
        util-linux
        login
        passwd
        bash
        iproute2
        iputils-ping
        procps
        ca-certificates
        less
        nano

[Build]
# Build with a pinned Debian 13 tool set instead of whatever the host has,
# so images are identical whether built natively, in the builder container
# or in CI.
ToolsTree=default
ToolsTreeDistribution=debian
ToolsTreeRelease=trixie
CacheDirectory=../build/cache
